<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Warehouse + Lakehouse: one SQL architecture</title>
<desc id="desc">Cloud Delta tables and mirrored-database targets are exposed through integration Lakehouse shortcuts beside hosted Delta tables. The Lakehouse SQL analytics endpoint serves Warehouse three-part reads, with optional Warehouse-owned gold materialization. Conceptual current architecture, not a measured deployment or a claim that arbitrary files are SQL tables. Shortcut/source identities, formats and freshness remain separate.</desc>
