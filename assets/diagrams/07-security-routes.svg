<rect id="07-security-routes-033" x="65" y="890" width="1035" height="118" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="07-security-routes-034" x="582.5" y="910.72" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="582.5" y="910.72">Both endpoint modes require initial item access.</tspan>
<tspan x="582.5" y="949.0">SQL permissions still govern views, procedures and functions.</tspan>
</text>
<rect id="07-security-routes-035" x="1135" y="890" width="500" height="118" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="07-security-routes-036" x="1385.0" y="912.04" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1385.0" y="912.04">CLS controls columns.</tspan>
<tspan x="1385.0" y="949.0">Encryption protects stored bytes.</tspan>
</text>
<rect id="07-security-routes-037" x="60" y="1050" width="1580" height="82" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
