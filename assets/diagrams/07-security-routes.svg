<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Authorization depends on the access route</title>
<desc id="desc">Conceptual security routes. Delegated endpoint mode uses SQL table authorization; user-identity mode uses OneLake roles for underlying table data. Direct storage access is a separate route and does not automatically inherit SQL policy. SQL analytics endpoint mode diagram, not a universal Warehouse security matrix. OneLake DDM is not available in user-identity mode; elevated roles require separate review.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="07-security-routes-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Authorization depends on the access route</tspan>
</text>
<text id="07-security-routes-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">OneLake security is authorization, not encryption; item Read alone does not grant data read.</tspan>
</text>
