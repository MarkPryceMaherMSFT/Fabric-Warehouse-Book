<polygon points="1100.00,372.00 1084.00,379.00 1084.00,365.00" fill="#0078D4"/>
<rect id="04-artifact-ownership-014" x="75" y="535" width="330" height="165" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="04-artifact-ownership-015" x="240.0" y="581.86" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="240.0" y="581.86">Spark + ingestion</tspan>
<tspan x="240.0" y="617.5">Lakehouse owns writes</tspan>
