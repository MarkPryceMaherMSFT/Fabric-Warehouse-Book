<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Three artifacts, three write owners</title>
<desc id="desc">Conceptual write-ownership lanes for Warehouse, Lakehouse and mirrored database. The mirrored upstream system remains authoritative for source writes. Mirroring is source-specific. SQL endpoint reads do not transfer ownership of data writes.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="04-artifact-ownership-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Three artifacts, three write owners</tspan>
</text>
<text id="04-artifact-ownership-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Warehouse writes differ from Lakehouse and mirrored SQL analytics endpoint reads.</tspan>
</text>
<polyline id="04-artifact-ownership-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
<text id="04-artifact-ownership-003" x="75" y="221" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="75" y="221.0">Authoritative writer</tspan>
</text>
<text id="04-artifact-ownership-004" x="450" y="221" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="450" y="221.0">Fabric item + data</tspan>
</text>
<text id="04-artifact-ownership-005" x="1110" y="221" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="1110" y="221.0">SQL surface</tspan>
</text>
<rect id="04-artifact-ownership-006" x="75" y="290" width="330" height="165" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="04-artifact-ownership-007" x="240.0" y="336.86" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="240.0" y="336.86">Warehouse SQL</tspan>
<tspan x="240.0" y="372.5">Insert / update / delete</tspan>
</text>
<rect id="04-artifact-ownership-008" x="490" y="290" width="535" height="165" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="04-artifact-ownership-009" x="757.5" y="332.9" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="757.5" y="332.9">Warehouse</tspan>
<tspan x="757.5" y="372.5">Managed OneLake tables</tspan>
</text>
<rect id="04-artifact-ownership-010" x="1110" y="290" width="520" height="165" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="04-artifact-ownership-011" x="1370.0" y="334.22" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1370.0" y="334.22">Warehouse SQL</tspan>
<tspan x="1370.0" y="372.5">Reads + managed writes</tspan>
</text>
