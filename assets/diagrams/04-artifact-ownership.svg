<text id="04-artifact-ownership-017" x="757.5" y="577.9" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="757.5" y="577.9">Lakehouse</tspan>
<tspan x="757.5" y="617.5">Delta tables in OneLake</tspan>
</text>
<rect id="04-artifact-ownership-018" x="1110" y="535" width="520" height="165" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="04-artifact-ownership-019" x="1370.0" y="579.22" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1370.0" y="579.22">SQL analytics endpoint</tspan>
<tspan x="1370.0" y="617.5">Reads Lakehouse tables</tspan>
</text>
<polyline id="04-artifact-ownership-020" points="410,617 480,617" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round"/>
<polygon points="480.00,617.00 464.00,624.00 464.00,610.00" fill="#008575"/>
<polyline id="04-artifact-ownership-021" points="1030,617 1100,617" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1100.00,617.00 1084.00,624.00 1084.00,610.00" fill="#008575"/>
<rect id="04-artifact-ownership-022" x="75" y="780" width="330" height="165" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text id="04-artifact-ownership-023" x="240.0" y="826.86" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="240.0" y="826.86">Upstream database</tspan>
<tspan x="240.0" y="862.5">Source owns writes</tspan>
</text>
<rect id="04-artifact-ownership-024" x="490" y="780" width="535" height="165" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text id="04-artifact-ownership-025" x="757.5" y="822.9" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="757.5" y="822.9">Mirrored database</tspan>
<tspan x="757.5" y="862.5">Replicated copy in OneLake</tspan>
</text>
<rect id="04-artifact-ownership-026" x="1110" y="780" width="520" height="165" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text id="04-artifact-ownership-027" x="1370.0" y="824.22" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1370.0" y="824.22">SQL analytics endpoint</tspan>
<tspan x="1370.0" y="862.5">Reads mirrored copy</tspan>
</text>
<polyline id="04-artifact-ownership-028" points="410,862 480,862" fill="none" stroke="#107C10" stroke-width="4" stroke-linejoin="round"/>
<polygon points="480.00,862.00 464.00,869.00 464.00,855.00" fill="#107C10"/>
<polyline id="04-artifact-ownership-029" points="1030,862 1100,862" fill="none" stroke="#107C10" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1100.00,862.00 1084.00,869.00 1084.00,855.00" fill="#107C10"/>
<text id="04-artifact-ownership-030" x="75" y="984" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="75" y="984.0">Independent lanes: no Warehouse-to-Lakehouse replication is implied.</tspan>
</text>
<rect id="04-artifact-ownership-031" x="60" y="1050" width="1580" height="82" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="04-artifact-ownership-032" x="850.0" y="1072.52" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="1072.52">Shared storage formats do not make all artifacts interchangeable or all engines valid writers.</tspan>
</text>
<rect id="04-artifact-ownership-033" x="63" y="1157" width="23" height="23" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="04-artifact-ownership-034" x="96" y="1150" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
