<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">OneLake paths connect readers to data</title>
<desc id="desc">Conceptual direct and shortcut read paths. An external shortcut references existing data rather than creating an independent authoritative copy. Reader, shortcut type and source determine supported features and permissions.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="03-onelake-paths-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">OneLake paths connect readers to data</tspan>
</text>
<text id="03-onelake-paths-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">A shortcut points to a source; compute and authorization still live on the reading route.</tspan>
</text>
<polyline id="03-onelake-paths-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
<rect id="03-onelake-paths-003" x="70" y="220" width="720" height="525" rx="18" fill="none" stroke="#008575" stroke-width="3"/>
