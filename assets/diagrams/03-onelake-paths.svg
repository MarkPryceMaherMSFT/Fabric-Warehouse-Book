<tspan x="1290.0" y="575.4">Result</tspan>
<tspan x="1290.0" y="615.0">Rows computed when requested</tspan>
</text>
<polyline id="03-onelake-paths-019" points="420,400 990,400" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round"/>
<polygon points="990.00,400.00 974.00,407.00 974.00,393.00" fill="#008575"/>
<text id="03-onelake-paths-020" x="815" y="341" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="815" y="341.0">read data</tspan>
</text>
<polyline id="03-onelake-paths-021" points="740,614 860,614 860,451 990,451" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round"/>
<polygon points="990.00,451.00 974.00,458.00 974.00,444.00" fill="#008575"/>
<polyline id="03-onelake-paths-022" points="1290,470 1290,535" fill="none" stroke="#0078D4" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1290.00,535.00 1283.00,519.00 1297.00,519.00" fill="#0078D4"/>
<rect id="03-onelake-paths-023" x="70" y="825" width="745" height="160" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="03-onelake-paths-024" x="442.5" y="845.6" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="442.5" y="845.6">Path is not permission</tspan>
<tspan x="442.5" y="885.2">Source access and consumer access</tspan>
<tspan x="442.5" y="924.8000000000001">must both be designed.</tspan>
</text>
<rect id="03-onelake-paths-025" x="875" y="825" width="755" height="160" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="03-onelake-paths-026" x="1252.5" y="847.58" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1252.5" y="847.58">Reference is not ownership</tspan>
<tspan x="1252.5" y="885.86">A shortcut does not grant permission</tspan>
<tspan x="1252.5" y="924.1400000000001">to rewrite Warehouse-managed files.</tspan>
</text>
<rect id="03-onelake-paths-027" x="60" y="1050" width="1580" height="82" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="03-onelake-paths-028" x="850.0" y="1072.52" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="1072.52">Separate three questions: where are the bytes, who may read them, and which engine computes?</tspan>
</text>
<rect id="03-onelake-paths-029" x="63" y="1157" width="23" height="23" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="03-onelake-paths-030" x="96" y="1150" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="96" y="1150.0">SQL / control</tspan>
</text>
<rect id="03-onelake-paths-031" x="329" y="1157" width="23" height="23" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="03-onelake-paths-032" x="362" y="1150" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="362" y="1150.0">Storage / flow</tspan>
</text>
