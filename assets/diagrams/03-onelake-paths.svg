<tspan x="92" y="237.0">Storage and references</tspan>
</text>
<rect id="03-onelake-paths-005" x="110" y="330" width="300" height="140" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="03-onelake-paths-006" x="260.0" y="359.08" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="260.0" y="359.08">OneLake</tspan>
<tspan x="260.0" y="400.0">Managed table</tspan>
</text>
<rect id="03-onelake-paths-007" x="110" y="545" width="300" height="140" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="03-onelake-paths-008" x="260.0" y="575.4" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="260.0" y="575.4">External source</tspan>
<tspan x="260.0" y="615.0">Existing data</tspan>
</text>
<rect id="03-onelake-paths-009" x="475" y="545" width="265" height="140" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="03-onelake-paths-010" x="607.5" y="575.4" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="607.5" y="575.4">Shortcut</tspan>
<tspan x="607.5" y="615.0">Reference</tspan>
</text>
<polyline id="03-onelake-paths-011" points="475,615 420,615" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round"/>
<polygon points="420.00,615.00 436.00,608.00 436.00,622.00" fill="#008575"/>
<text id="03-onelake-paths-012" x="470" y="492" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="470" y="492.0">resolves to source</tspan>
</text>
<rect id="03-onelake-paths-013" x="955" y="220" width="675" height="525" rx="18" fill="none" stroke="#0078D4" stroke-width="3"/>
<text id="03-onelake-paths-014" x="977" y="237" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="977" y="237.0">Compute reads through a supported route</tspan>
</text>
<rect id="03-onelake-paths-015" x="1000" y="330" width="580" height="140" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="03-onelake-paths-016" x="1290.0" y="360.4" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1290.0" y="360.4">SQL / Spark / other reader</tspan>
<tspan x="1290.0" y="400.0">Compatibility + identity matter</tspan>
</text>
