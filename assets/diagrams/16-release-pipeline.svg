<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">A deployment is a reviewed change, not just a file push</title>
<desc id="desc">Conceptual release pipeline with schema comparison, a reviewed deployment artifact, one designated pre-deployment script, model deployment, one post-deployment script and validation. Scripts run every deployment, must be idempotent and are not model-validated at build. Failures halt deployment. Existing Git projects require the documented upgrade.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="16-release-pipeline-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">A deployment is a reviewed change, not just a file push</tspan>
</text>
<text id="16-release-pipeline-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">CI/CD 2.0 DacFx and deployment scripts are preview; check the project's upgrade prerequisites.</tspan>
</text>
