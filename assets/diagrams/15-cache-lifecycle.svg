<tspan x="1375.0" y="785.94">Separate feature</tspan>
<tspan x="1375.0" y="824.22">Result-set cache reuses</tspan>
<tspan x="1375.0" y="862.5">an eligible prior answer;</tspan>
<tspan x="1375.0" y="900.7800000000001">a data cache reuses data.</tspan>
</text>
