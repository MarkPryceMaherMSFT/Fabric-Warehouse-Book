<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Cache warmth changes work, not query semantics</title>
<desc id="desc">Conceptual cache lifecycle: a read may fetch data from OneLake or reuse managed disk and memory caches. Announced cooldown controls are not shown as an existing UI. Cache cooldown public preview is coming soon. Exact timers, defaults, scope, affected layers and billing are unpublished. Result-set caching is a separate feature.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="15-cache-lifecycle-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Cache warmth changes work, not query semantics</tspan>
</text>
<text id="15-cache-lifecycle-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Managed data caching exists today. Configurable cooldown is a forthcoming capability.</tspan>
</text>
