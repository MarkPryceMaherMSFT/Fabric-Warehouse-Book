<tspan x="555.0" y="840.54">Intent: balance warm performance and cache lifecycle cost</tspan>
<tspan x="555.0" y="877.5">No documented timer, ALTER setting or configuration UI here</tspan>
</text>
<rect id="15-cache-lifecycle-021" x="1120" y="760" width="510" height="205" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
