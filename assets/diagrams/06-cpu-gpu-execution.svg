<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">GPU acceleration is a partial execution choice</title>
<desc id="desc">Conceptual CPU/GPU split: an eligible portion of execution may use GPU acceleration while other work stays on CPU and results are combined. Illustrative operator split only; not an observed plan, benchmark or universal speedup. Accelerated-workspace metering includes ineligible queries; toggling cancels requests.</desc>
