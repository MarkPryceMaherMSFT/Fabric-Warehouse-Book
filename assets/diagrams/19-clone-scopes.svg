<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Table clone and whole-Warehouse clone differ in scope</title>
<desc id="desc">Conceptual clone-scope comparison. Current CREATE TABLE AS CLONE OF targets a table; announced whole-Warehouse cloning is a separate forthcoming capability. Warehouse-level clone public preview is coming soon. No Warehouse syntax, security inheritance or cross-workspace behavior is implied.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="19-clone-scopes-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Table clone and whole-Warehouse clone differ in scope</tspan>
</text>
<text id="19-clone-scopes-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">A current table-level capability must not be used as proof that the announced Warehouse clone exists.</tspan>
</text>
<polyline id="19-clone-scopes-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
