<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Metadata sync separates discovery from freshness</title>
<desc id="desc">Conceptual comparison of legacy background synchronization and new preview metadata sync, where schema discovery and existing-table data freshness are decoupled. New sync is preview and opt-in for newly created endpoints; existing endpoints are not automatically upgraded. Query refresh is not synchronous schema discovery.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="11-metadata-sync-generations-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Metadata sync separates discovery from freshness</tspan>
</text>
<text id="11-metadata-sync-generations-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">"v1" and "v2" are book shorthand for legacy and new sync, not REST API versions.</tspan>
</text>
<polyline id="11-metadata-sync-generations-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
