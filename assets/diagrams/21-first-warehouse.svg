<title id="title">First Warehouse: create, seed, then reconcile</title>
<desc id="desc">Concrete high-level walkthrough of the book's Warehouse seed: create BookWarehouse, run 04-create-book-warehouse.sql, then verify the six canonical sales, ten units and 365.00 revenue, with GB 185.00 and DE 180.00. Expected values are computed offline from the canonical seed, not measured against a live tenant. Run write scripts only in the isolated book lab.</desc>
