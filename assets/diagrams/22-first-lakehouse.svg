<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">First Lakehouse: write with Spark, read through SQL</title>
<desc id="desc">Concrete high-level walkthrough: create a schema-enabled BookLakehouse, attach it to a Spark notebook, run 05-create-book-lakehouse.py, then verify discovery and read the canonical rows through the SQL analytics endpoint. The endpoint is a read surface for Lakehouse tables. Metadata readiness must be verified; no fixed wait guarantees freshness. Expected totals are offline seed checks.</desc>
