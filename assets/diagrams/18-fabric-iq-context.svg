<text id="18-fabric-iq-context-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Business context does not replace the query engine</tspan>
</text>
<text id="18-fabric-iq-context-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Ontology bindings, current IQ MCP access and future Warehouse integration are distinct contracts.</tspan>
</text>
