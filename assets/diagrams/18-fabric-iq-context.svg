<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Business context does not replace the query engine</title>
<desc id="desc">Conceptual Fabric IQ map. Preview ontology binds business entities to sources; it is not a new storage or query engine. Current IQ MCP supports read-only semantic-model and report discovery plus DAX; Warehouse-specific IQ integration is future. Optional graph materialization is not a universal execution path. Current IQ MCP does not establish ontology or data-agent support; source execution remains source-specific.</desc>
