<tspan x="845.0" y="270.6">Statistics</tspan>
<tspan x="845.0" y="310.20000000000005">Compact summaries</tspan>
<tspan x="845.0" y="349.8">of column values</tspan>
</text>
<rect id="12-statistics-feedback-007" x="1225" y="250" width="400" height="160" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
