<text id="12-statistics-feedback-021" x="310" y="550" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="310" y="550.0">Human diagnostic loop: refresh only when evidence justifies it</tspan>
</text>
<rect id="12-statistics-feedback-022" x="75" y="885" width="1550" height="112" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="12-statistics-feedback-023" x="850.0" y="901.4" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="901.4">A good histogram cannot discover a missing Lakehouse table,</tspan>
<tspan x="850.0" y="941.0">repair duplicate dimension keys or guarantee a globally optimal plan.</tspan>
</text>
<rect id="12-statistics-feedback-024" x="60" y="1050" width="1580" height="82" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="12-statistics-feedback-025" x="850.0" y="1072.52" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="1072.52">Validate semantics first; statistics maintenance improves information available to the optimizer.</tspan>
</text>
<rect id="12-statistics-feedback-026" x="63" y="1157" width="23" height="23" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
