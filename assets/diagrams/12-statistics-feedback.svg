<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Statistics inform estimates, not business truth</title>
<desc id="desc">Conceptual diagnostic loop linking distributions, statistics, cardinality estimates, plan decisions and observed execution evidence. The return loop is an operator's investigation, not a promised automatic query-feedback feature.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="12-statistics-feedback-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Statistics inform estimates, not business truth</tspan>
</text>
<text id="12-statistics-feedback-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Compare predicted rows with observed work before choosing a targeted maintenance action.</tspan>
</text>
<polyline id="12-statistics-feedback-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
