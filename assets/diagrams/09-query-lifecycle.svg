<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">QO chooses; DQP coordinates; QE executes</title>
<desc id="desc">Conceptual query lifecycle distinguishing the query optimizer (QO), Distributed Query Processor (DQP) and local query execution engines (QE). Task counts, placement, retries and scheduler algorithms are illustrative, not product guarantees.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="09-query-lifecycle-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">QO chooses; DQP coordinates; QE executes</tspan>
</text>
<text id="09-query-lifecycle-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">A responsibility map from SQL text to distributed results, not a fixed private service topology.</tspan>
</text>
<polyline id="09-query-lifecycle-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
<rect id="09-query-lifecycle-003" x="70" y="250" width="335" height="155" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
