<tspan x="237.5" y="268.1">Bind SQL</tspan>
<tspan x="237.5" y="307.70000000000005">Objects, types,</tspan>
<tspan x="237.5" y="347.3">security context</tspan>
</text>
<rect id="09-query-lifecycle-005" x="505" y="250" width="465" height="155" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="09-query-lifecycle-006" x="737.5" y="268.1" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="737.5" y="268.1">QO: query optimizer</tspan>
<tspan x="737.5" y="307.70000000000005">Estimate + cost alternatives</tspan>
<tspan x="737.5" y="347.3">Choose physical strategy</tspan>
</text>
<rect id="09-query-lifecycle-007" x="1070" y="250" width="560" height="155" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="09-query-lifecycle-008" x="1350.0" y="270.08" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1350.0" y="270.08">DQP: distributed coordination</tspan>
<tspan x="1350.0" y="308.36">Task dependencies + resources</tspan>
<tspan x="1350.0" y="346.64">Schedule eligible work</tspan>
</text>
