<text id="09-query-lifecycle-028" x="850.0" y="1072.52" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="1072.52">A poor estimate, a scheduling wait and slow local execution are different hypotheses to investigate.</tspan>
