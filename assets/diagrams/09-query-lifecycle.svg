<text id="09-query-lifecycle-020" x="100" y="455" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="100" y="455.0">Tasks may run concurrently when dependencies and resources permit.</tspan>
</text>
<rect id="09-query-lifecycle-021" x="70" y="895" width="700" height="105" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="09-query-lifecycle-022" x="420.0" y="907.9" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="420.0" y="907.9">OneLake data + managed caches</tspan>
<tspan x="420.0" y="947.5">Storage is not the scheduler</tspan>
</text>
