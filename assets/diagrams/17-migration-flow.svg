<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Migrate schema and data as separate workstreams</title>
<desc id="desc">Conceptual migration plan with parallel schema/logic and data movement workstreams converging on correctness validation and an approved cutover. Assistant and connector capabilities vary. Watermarks do not propagate deletes; CDC requires a supported CDC-enabled source. No translation equivalence is promised.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="17-migration-flow-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Migrate schema and data as separate workstreams</tspan>
</text>
<text id="17-migration-flow-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Translation is a starting point; reconciliation and a reversible cutover prove the migration.</tspan>
</text>
