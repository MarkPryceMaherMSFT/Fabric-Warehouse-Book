<tspan x="320.0" y="670.2">A managed artifact:</tspan>
<tspan x="320.0" y="709.8000000000001">not always a table</tspan>
</text>
<rect id="02-fabric-concepts-021" x="125" y="835" width="1370" height="145" rx="18" fill="none" stroke="#008575" stroke-width="3"/>
