<tspan x="147" y="852.0">OneLake  |  storage, not compute</tspan>
</text>
<text id="02-fabric-concepts-023" x="155" y="900" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
