<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Fabric's organizing layers</title>
<desc id="desc">Conceptual containment and assignment map. A capacity supplies compute to an assigned workspace; OneLake is a storage foundation, not a second capacity. One illustrative assignment; not a physical infrastructure map.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="02-fabric-concepts-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Fabric's organizing layers</tspan>
</text>
<text id="02-fabric-concepts-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Tenant, capacity, workspace and item answer different administrative questions.</tspan>
</text>
