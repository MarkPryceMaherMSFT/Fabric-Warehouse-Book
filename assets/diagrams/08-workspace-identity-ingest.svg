<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">COPY INTO uses two authorization contexts</title>
<desc id="desc">Conceptual COPY INTO authorization: the caller retains target INSERT responsibility, while the Fabric-managed workspace identity reads the authorized source. Workspace Identity COPY INTO is GA as of August 2026. Source-specific role, ACL, network and workspace-membership requirements still apply.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="08-workspace-identity-ingest-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">COPY INTO uses two authorization contexts</tspan>
</text>
<text id="08-workspace-identity-ingest-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Workspace Identity authorizes the source read; it does not replace the caller's target SQL rights.</tspan>
</text>
<polyline id="08-workspace-identity-ingest-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
