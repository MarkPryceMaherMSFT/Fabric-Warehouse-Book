<text id="08-workspace-identity-ingest-027" x="70" y="952" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="70" y="952.0">One identity reads the source. A different authorization context permits the target write.</tspan>
</text>
