<rect id="24-delta-table-anatomy-028" x="60" y="1050" width="1580" height="82" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="24-delta-table-anatomy-029" x="850.0" y="1072.52" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="850.0" y="1072.52">Persisted types and reader compatibility are contracts; visible files alone do not prove a committed table state.</tspan>
</text>
