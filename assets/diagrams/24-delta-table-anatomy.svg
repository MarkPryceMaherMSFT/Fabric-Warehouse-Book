<tspan x="1137" y="242.0">Warehouse publication</tspan>
</text>
<rect id="24-delta-table-anatomy-020" x="1150" y="335" width="455" height="145" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="24-delta-table-anatomy-021" x="1377.5" y="374.5" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1377.5" y="374.5">1  SQL transaction commits</tspan>
<tspan x="1377.5" y="407.5">New SQL reads can be current</tspan>
</text>
<rect id="24-delta-table-anatomy-022" x="1150" y="565" width="455" height="145" rx="16" fill="#D5F1ED" stroke="#008575" stroke-width="3"/>
<text id="24-delta-table-anatomy-023" x="1377.5" y="604.5" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1377.5" y="604.5">2  Background publisher</tspan>
<tspan x="1377.5" y="637.5">Emits compatible Delta state</tspan>
</text>
<rect id="24-delta-table-anatomy-024" x="1150" y="795" width="455" height="145" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text id="24-delta-table-anatomy-025" x="1377.5" y="818.0" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="1377.5" y="818.0">3  External Delta reader</tspan>
<tspan x="1377.5" y="851.0">Checks its own access and</tspan>
<tspan x="1377.5" y="884.0">observes published state</tspan>
</text>
