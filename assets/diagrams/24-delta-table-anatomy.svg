<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a Delta table: values plus valid state</title>
<desc id="desc">A simplified Delta table combines Parquet data files, JSON transaction actions and checkpoint metadata. Warehouse SQL commit, background Delta publication and an authorized external reader observing that state are separate boundaries. Conceptual format/publishing map, not a private Warehouse directory layout. A checkpoint holds metadata, not another batch of business rows; external access does not automatically inherit SQL RLS or CLS.</desc>
<rect width="1700" height="1200" fill="#ffffff"/>
<text id="24-delta-table-anatomy-000" x="60" y="45" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="45.0">Anatomy of a Delta table: values plus valid state</tspan>
</text>
<text id="24-delta-table-anatomy-001" x="60" y="116" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="60" y="116.0">Parquet encodes values. Delta selects a table snapshot. Warehouse publishes outward after SQL commit.</tspan>
</text>
<polyline id="24-delta-table-anatomy-002" points="60,174 1640,174" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
