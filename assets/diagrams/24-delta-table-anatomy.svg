<tspan x="312.5" y="354.0">Parquet data files</tspan>
<tspan x="312.5" y="387.0">Row groups &gt; column chunks</tspan>
<tspan x="312.5" y="420.0">Encoded/compressed pages</tspan>
<tspan x="312.5" y="453.0">Footer + type annotations</tspan>
</text>
<rect id="24-delta-table-anatomy-007" x="100" y="600" width="425" height="170" rx="16" fill="#F3F2F1" stroke="#605E5C" stroke-width="3"/>
<text id="24-delta-table-anatomy-008" x="312.5" y="635.5" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="312.5" y="635.5">Version 0: A + B</tspan>
<tspan x="312.5" y="668.5">Version 1: B + C</tspan>
<tspan x="312.5" y="701.5">A can remain for retention</tspan>
</text>
