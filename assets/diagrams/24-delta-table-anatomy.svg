<text id="24-delta-table-anatomy-010" x="597" y="317" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">
<tspan x="597" y="317.0">_delta_log (metadata)</tspan>
</text>
<rect id="24-delta-table-anatomy-011" x="610" y="385" width="385" height="160" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text id="24-delta-table-anatomy-012" x="802.5" y="417.48" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="802.5" y="417.48">JSON commit versions</tspan>
<tspan x="802.5" y="449.16">Schema + protocol</tspan>
