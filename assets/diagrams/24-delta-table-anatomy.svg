<text id="24-delta-table-anatomy-014" x="802.5" y="654.98" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="text-before-edge">
<tspan x="802.5" y="654.98">Checkpoint metadata</tspan>
<tspan x="802.5" y="686.66">Summarizes log state</tspan>
<tspan x="802.5" y="718.34">Not sales rows</tspan>
</text>
<polyline id="24-delta-table-anatomy-015" points="800,555 800,615" fill="none" stroke="#0078D4" stroke-width="4" stroke-linejoin="round"/>
